<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Drifting coloured dots, as on the website hero">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>
  <style>
    /* Smooth, brisk drifting particle dynamics */
    @keyframes path0 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(35px, -25px); }
      66%  { transform: translate(55px, 15px); }
      85%  { transform: translate(20px, 35px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes path1 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(-30px, 25px); }
      66%  { transform: translate(-50px, -10px); }
      85%  { transform: translate(-20px, -30px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes path2 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(25px, 30px); }
      66%  { transform: translate(-15px, 45px); }
      85%  { transform: translate(-35px, 15px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes path3 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(-25px, -25px); }
      66%  { transform: translate(20px, -45px); }
      85%  { transform: translate(40px, -15px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes path4 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(40px, -18px); }
      66%  { transform: translate(20px, -38px); }
      85%  { transform: translate(-18px, -20px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes path5 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(-35px, -20px); }
      66%  { transform: translate(-15px, -40px); }
      85%  { transform: translate(25px, -15px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes path6 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(30px, 25px); }
      66%  { transform: translate(50px, 10px); }
      85%  { transform: translate(25px, -20px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes path7 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(-40px, 20px); }
      66%  { transform: translate(-20px, 45px); }
      85%  { transform: translate(20px, 25px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes path8 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(20px, -35px); }
      66%  { transform: translate(45px, -20px); }
      85%  { transform: translate(30px, 15px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes path9 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(-25px, 30px); }
      66%  { transform: translate(10px, 45px); }
      85%  { transform: translate(35px, 20px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes path10 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(35px, 20px); }
      66%  { transform: translate(15px, -30px); }
      85%  { transform: translate(-20px, -15px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes path11 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(-30px, -30px); }
      66%  { transform: translate(25px, -20px); }
      85%  { transform: translate(15px, 25px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes path12 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(45px, 10px); }
      66%  { transform: translate(25px, 35px); }
      85%  { transform: translate(-15px, 20px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes path13 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(-35px, 15px); }
      66%  { transform: translate(-15px, -35px); }
      85%  { transform: translate(20px, -20px); }
      100% { transform: translate(0px, 0px); }
    }
